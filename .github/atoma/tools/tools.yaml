# Tools configuration for Atoma GitHub templates
#
# Every server named here must cover the union of `mcp_servers` across
# .github/atoma/agent-definitions/*.md. An agent naming a server that is absent
# here aborts before any MCP server starts ("Tool 'X' not found in tools file"),
# so removals must be checked against all three agents, not just the one in
# front of you. `agent-definitions.test.ts` enforces this.
#
# This is where a credential is ROUTED to the server that needs it, with a
# `${NAME}` reference in that server's `env`. A server receives exactly what it
# names here and nothing else -- atoma removes every credential it knows about
# from a server's environment before applying this block, so leaving `env: {}`
# means "this server gets no credentials", and that is the point rather than an
# oversight.
#
# `args` paths carry `${ATOMA_MACHINERY_ROOT:-.}` for a different reason, and it is
# not about secrets. On a pull request run the workspace IS the pull request, so a
# server read from `.github/atoma/tools/scripts/...` would be the pull request's
# own copy -- letting it replace the code of the tools that review it. The prefix
# points at a checkout of the default branch instead, and falls back to `.` where
# no such checkout exists, such as a hand-run `atoma`.
#
# `args: ["."]` on the filesystem servers is deliberately NOT prefixed: that one
# is the workspace, which is exactly what those servers should be reading.
#
# `before_tool` is NOT prefixed either, and for a third reason: atoma resolves a
# relative hook path against the directory of THIS file, not against the working
# directory. Verified in the core -- `persistence/tool_def.rs` sets
# `base_dir = path.parent()` and joins any non-absolute hook path onto it, then
# fails the run if the result does not exist. The runner passes
# `--tools-file ${ATOMA_MACHINERY_ROOT}/.github/atoma/tools/tools.yaml`, so the
# hook comes from the same default-branch checkout the `args` prefix points at,
# and gets there without being asked.
#
# Written down because the paragraph above argues the pull-request-replaces-the-
# code point for `args` and said nothing about the hook -- and the hook is the
# one piece of code that inspects what the agent is about to run, so a reader
# checking that argument holds should not have to go and read the core to
# find out.
#
# Never write a value here, only a reference. `${SLACK_TOKEN}` is resolved at run
# time; a pasted secret would be committed in plain text.
#
# Where the value comes from is a different layer. Add the secret to the
# repository, then name it in config.json's `tools.secrets` -- that authorises the
# run to obtain it. This file decides which server it reaches. Both steps are
# needed and neither substitutes for the other; see docs/customization.md, "Give a
# tool a credential".

filesystem:
  command: mcp-server-filesystem
  args: ["."]
  env: {}
  hooks:
    tool_denylist:
      - "filesystem__directory_tree"
      - "filesystem__search_files"

filesystem_readonly:
  command: mcp-server-filesystem
  args: ["."]
  env: {}
  hooks:
    tool_allowlist:
      - "filesystem_readonly__read_file"
      - "filesystem_readonly__read_multiple_files"
      # Returns an image as an image block rather than as bytes read into text.
      # An agent whose definition sets `vision: true` can look at a screenshot
      # in the repository; one without it gets a note saying the picture was
      # withheld. Reading an image through `read_file` produces neither.
      - "filesystem_readonly__read_media_file"
      - "filesystem_readonly__list_directory"
      - "filesystem_readonly__get_file_info"

# The one server that runs arbitrary commands, and therefore the one that runs
# third-party code: a dependency's postinstall, a setup.py, a build.rs. Those run
# with this server's privileges, and every other server here holds exactly the
# credentials its own entry declares. So this is the server that must not be able
# to read the others.
#
# It runs in a rootless podman container. `env: {}` was never enough on its own:
# a process running as the same user can read /proc/<pid>/environ of the servers
# that DO hold credentials, and can drop a fake `gh` into ~/.bun/bin, which is on
# their PATH. Neither needs an exploit or a misbehaving agent.
#
# See #374 for the twenty-four measurements behind each flag, and the four other
# designs they ruled out. In short:
#
#   --user 1234:0        NOT uid 0. Rootless podman maps container uid 0 to the
#                        host user, which would put this container's environment
#                        back within reach of everything running as that user.
#                        Any other id maps into the subuid range instead, and
#                        /proc/<pid>/environ becomes unreadable from the host.
#                        Group 0 maps to the host user's primary group, which is
#                        how the container writes a work tree the host owns.
#                        Not 1000 either: the runner image already carries a
#                        `packer` account at that id, and the passwd the container
#                        sees is the host's plus one line, so that name won the
#                        lookup and the nested runtime found no subuid range for
#                        it. Keep this in step with CONTAINER_UID in
#                        prepare_shell_confinement.ts, which now fails the run if
#                        the host ever takes the id.
#
#   /usr /opt /etc :ro   The host's whole toolchain, at the same paths, read-only.
#                        No published image and nothing language-specific: bun,
#                        node, python, go, cargo, java and dotnet all come from
#                        the runner. Read-only is also what stops PATH poisoning,
#                        since /usr/local/bin is world-writable on the host.
#
#   the overlay          $HOME has to be readable (rustup, nvm and pyenv keep the
#                        toolchain there, not just caches), writable (every
#                        ecosystem caches there), and without effect on the host
#                        (~/.bun/bin is on the PATH; ~/.gitconfig makes host git
#                        run what it is told). An overlay is one mechanism that
#                        gives all three, with no list of blocked filenames.
#
#   the work tree        A plain bind at its REAL path, so `pwd` matches the host
#                        and an error naming a file names the same file on both
#                        sides.
#
#   unmask=...           Only what a nested container runtime needs. Docker's
#                        equivalent is all-or-nothing and leaves
#                        /proc/sysrq-trigger writable, which is a way to reboot
#                        the runner; podman can open /proc/sys and leave that
#                        closed. Measured both ways.
#
#   XDG_*                A nested container runtime keeps its config, storage and
#                        runtime state under these. Left unset they resolve under
#                        HOME, which is the overlay and owned by the host user, so
#                        podman refused to start at all:
#                          path "/home/runner/.config" exists and it is not owned
#                          by the current user
#                        The entrypoint creates them, because setting the variable
#                        and not the directory left podman looking at a path that
#                        was not there.
#
#   /dev/fuse, /dev/net/tun
#                        Storage and networking for containers the agent starts
#                        itself. The docker socket is deliberately NOT mounted:
#                        with it, the container reads a host process's environ
#                        through `--pid=host`, and the confinement is worth
#                        nothing.
#
#   ~/.local/bin first   Where the confinement step puts ONE generated script under
#                        both names a nested rootless runtime delegates its id
#                        mapping to. Deliberately not setuid -- that bit is what
#                        broke this, not what was missing.
#
#   --cap-add SETUID     What the mapping actually needs. Measured inside the
#   --cap-add SETGID     container on #426:
#                          CapPrm: 00000000000000c0  CapEff: 00000000000000c0
#                        podman hands a non-root --user its added capabilities as
#                        AMBIENT ones, and ambient capabilities are effective. The
#                        same run wrote podman's own two-line mapping by hand and
#                        it worked. Only the delegation failed: executing a setuid
#                        binary CLEARS the ambient set, and inside a non-initial
#                        user namespace a setuid-root file confers nothing to
#                        replace it, so newuidmap arrived as euid 0 with nothing to
#                        be root with:
#                          newuidmap: write to uid_map failed: Operation not
#                          permitted
#
#                        Be clear about what this costs: with CAP_SETUID effective,
#                        the container CAN reach uid 0 in its own namespace, which
#                        rootless podman maps to the host runner user. That is not
#                        the same as the host's root and it reaches nothing new --
#                        /usr, /opt and /etc are read-only, $HOME is the overlay,
#                        and the PID namespace is separate, which is what actually
#                        closes the environ route. The uid was never the part doing
#                        that work.
#
#   storage.conf         ignore_chown_errors, for the case where the runtime ends
#                        up in single-mapping mode: one id inside means an image's
#                        non-root files cannot be restored, and podman would rather
#                        fail the extraction than approximate it. Here the
#                        alternative is no nested containers at all.
#
# What the agent gives up: writes outside the work tree do not outlive the run.
# `shell_execute`'s description says so, because it is the kind of thing that
# looks like it worked.
shell:
  command: podman
  args:
    ["run", "--rm", "-i", "--user", "1234:0",
     "-v", "/usr:/usr:ro", "-v", "/opt:/opt:ro", "-v", "/etc:/etc:ro",
     "-v", "/mnt/atoma-shell-overlay/merged:/home/runner",
     "-v", "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}",
     "-v", "${RUNNER_TEMP}/atoma-shell-sandbox/passwd:/etc/passwd:ro",
     "-v", "${RUNNER_TEMP}/atoma-shell-sandbox/subuid:/etc/subuid:ro",
     "-v", "${RUNNER_TEMP}/atoma-shell-sandbox/subgid:/etc/subgid:ro",
     "-v", "${RUNNER_TEMP}/atoma-shell-sandbox/containers.conf:/etc/containers/containers.conf:ro",
     "-v", "${RUNNER_TEMP}/atoma-shell-sandbox/storage.conf:/etc/containers/storage.conf:ro",
     "--security-opt", "unmask=/proc/bus", "--security-opt", "unmask=/proc/fs",
     "--security-opt", "unmask=/proc/irq", "--security-opt", "unmask=/proc/sys",
     "--security-opt", "seccomp=unconfined",
     "--cap-add", "SETUID", "--cap-add", "SETGID",
     "--device", "/dev/fuse", "--device", "/dev/net/tun",
     "-w", "${GITHUB_WORKSPACE}",
     "-e", "HOME=/home/runner", "-e", "PATH=/home/runner/.local/bin:${PATH}",
     "-e", "XDG_RUNTIME_DIR=/tmp/atoma-xdg",
     "-e", "XDG_CONFIG_HOME=/tmp/atoma-xdg/config",
     "-e", "XDG_DATA_HOME=/tmp/atoma-xdg/data",
     "--entrypoint", "/usr/bin/bash",
     "docker.io/library/ubuntu:24.04",
     "-c", "mkdir -p \"$XDG_RUNTIME_DIR\" \"$XDG_CONFIG_HOME\" \"$XDG_DATA_HOME\" && exec bun run ${ATOMA_MACHINERY_ROOT:-.}/.github/atoma/tools/scripts/mcp/shell.ts"]
  env: {}
  hooks:
    before_tool: ./scripts/hooks/shell_guard.ts

github:
  command: bun
  args: ["run", "${ATOMA_MACHINERY_ROOT:-.}/.github/atoma/tools/scripts/mcp/github.ts"]
  # Shells out to `gh`, so it needs the run's GitHub token. Declared rather
  # than inherited: atoma strips credentials from a server that does not name
  # them, which is what keeps this one out of `shell`.
  env:
    GH_TOKEN: "${GH_TOKEN}"
  hooks: {}

web:
  command: bun
  args: ["run", "${ATOMA_MACHINERY_ROOT:-.}/.github/atoma/tools/scripts/mcp/web.ts"]
  env: {}
  hooks: {}

# Searches this repository's issues by meaning. Imports
# `@huggingface/transformers`, which the runner installs from
# `mcp-packages.json`'s `bun` list rather than receiving in the bundle — see
# build-dist.ts for why that one cannot be inlined.
search:
  command: bun
  args: ["run", "${ATOMA_MACHINERY_ROOT:-.}/.github/atoma/tools/scripts/mcp/search.ts"]
  # Shells out to `gh`, so it needs the run's GitHub token. Declared rather
  # than inherited: atoma strips credentials from a server that does not name
  # them, which is what keeps this one out of `shell`.
  env:
    GH_TOKEN: "${GH_TOKEN}"
  hooks: {}

atoma:
  command: bun
  args: ["run", "${ATOMA_MACHINERY_ROOT:-.}/.github/atoma/tools/scripts/mcp/atoma.ts"]
  # Shells out to `gh`, so it needs the run's GitHub token. Declared rather
  # than inherited: atoma strips credentials from a server that does not name
  # them, which is what keeps this one out of `shell`.
  env:
    GH_TOKEN: "${GH_TOKEN}"
  hooks: {}
