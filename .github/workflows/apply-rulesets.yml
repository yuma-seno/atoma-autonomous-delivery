name: Apply rulesets

# Branch protection as a reviewed config file instead of a settings screen.
#
# `.github/rulesets/*.json` is the source of truth; this workflow reconciles the
# repository against it. Changing what "mergeable" means is therefore a pull
# request like any other change, and `github__check_merge_readiness` reports
# against whatever the ruleset currently says rather than a second opinion
# hardcoded in the tool.
#
# Runs on demand, and on any push to main that touches a ruleset file.

on:
  push:
    branches: [main]
    paths:
      - ".github/rulesets/**"
      - ".github/workflows/apply-rulesets.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would be applied without changing anything"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # Repository rulesets live behind the administration API. If GITHUB_TOKEN turns
  # out not to be accepted here, the failure is explicit and the alternative is an
  # admin PAT — which we would rather not reintroduce, having just removed one.
  administration: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply each ruleset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          existing=$(gh api "repos/$REPO/rulesets" --jq '[.[] | {name, id}]')
          echo "Existing rulesets: $existing"

          for file in .github/rulesets/*.json; do
            name=$(jq -r '.name' "$file")
            id=$(jq -r --arg n "$name" '.[] | select(.name == $n) | .id' <<<"$existing")

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "--- would apply $file (name=$name, existing id=${id:-none})"
              jq . "$file"
              continue
            fi

            if [ -n "$id" ]; then
              echo "Updating ruleset '$name' (id $id) from $file"
              gh api --method PUT "repos/$REPO/rulesets/$id" --input "$file" --jq '.name + " -> " + .enforcement'
            else
              echo "Creating ruleset '$name' from $file"
              gh api --method POST "repos/$REPO/rulesets" --input "$file" --jq '.name + " -> " + .enforcement'
            fi
          done

      - name: Report what now applies to the default branch
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/rules/branches/${{ github.event.repository.default_branch }}" \
            --jq '[.[] | .type] | "Active rules: " + join(", ")'
