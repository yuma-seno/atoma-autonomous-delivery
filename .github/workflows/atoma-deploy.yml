name: Atoma Deploy
'on':
  workflow_dispatch:
    inputs:
      target:
        description: Deploy this one target by name. Leave empty to deploy what the trigger selects.
        required: false
        type: string
        default: ''
      trigger:
        description: Set to 'merge' by dispatchCd after a pull request lands. Leave as 'manual' by hand.
        required: false
        type: string
        default: manual
  push:
    tags:
      - '**'
    branches:
      - main
      - master
permissions:
  contents: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
    timeout-minutes: 60
    concurrency:
      group: atoma-deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        with:
          bun-version: latest
        uses: oven-sh/setup-bun@v2
      - name: Resolve which repository secrets may reach this run
        id: secret-names
        shell: bash
        env:
          ATOMA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          DEFAULT_BRANCH="${ATOMA_DEFAULT_BRANCH:-main}"
          TRUSTED_CONFIG="$RUNNER_TEMP/atoma-declared-secrets.json"

          # Fetched into a ref this line owns, and read back from that same ref, so a
          # failed fetch has nothing to fall back to. Shallow: one commit of one branch is
          # all this needs. `+` so a re-run overwrites rather than refusing.
          if git fetch --quiet --depth=1 origin "+$DEFAULT_BRANCH:refs/atoma/trusted-config" 2>/dev/null \
            && git show "refs/atoma/trusted-config:.github/atoma/config.json" > "$TRUSTED_CONFIG" 2>/dev/null; then
            echo "Read the credential declaration from ${DEFAULT_BRANCH}."
          else
            # Either the branch has no config.json or the fetch failed, and this cannot
            # tell which. It does not need to: both answers are "declare nothing", which is
            # the safe one. Naming both is the honest message -- asserting the first would
            # be asserting something this could not determine.
            echo '{}' > "$TRUSTED_CONFIG"
            echo "::warning::Could not read .github/atoma/config.json from ${DEFAULT_BRANCH} (absent, or the fetch failed); this run reaches no declared credentials."
          fi

          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/read_secret_names.ts" --destination "deploy" --config "$RUNNER_TEMP/atoma-declared-secrets.json"
      - name: Deploy the targets this run is for
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATOMA_SECRET_0: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[0]] }}
          ATOMA_SECRET_1: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[1]] }}
          ATOMA_SECRET_2: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[2]] }}
          ATOMA_SECRET_3: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[3]] }}
          ATOMA_SECRET_4: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[4]] }}
          ATOMA_SECRET_5: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[5]] }}
          ATOMA_SECRET_6: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[6]] }}
          ATOMA_SECRET_7: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[7]] }}
          ATOMA_SECRET_8: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[8]] }}
          ATOMA_SECRET_9: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[9]] }}
          ATOMA_SECRET_NAMES: ${{ steps.secret-names.outputs.names }}
          ATOMA_DEPLOY_REF: ${{ github.ref }}
          ATOMA_DEPLOY_TRIGGER: ${{ inputs.trigger }}
          ATOMA_DEPLOY_TARGET_INPUT: ${{ inputs.target }}
        run: |
          # Credentials arrive in numbered slots because this file is generated and cannot
          # know what a project called its Slack token; config.json does, and the resolve
          # step above published that list. Put the declared name back on each slot before
          # anything that needs one runs.
          ATOMA_DECLARED_SECRETS="${ATOMA_SECRET_NAMES:-[]}"
          ATOMA_DECLARED_COUNT=$(echo "$ATOMA_DECLARED_SECRETS" | jq -r 'length')
          slot=0
          while [ "$slot" -lt "$ATOMA_DECLARED_COUNT" ]; do
            secret_name=$(echo "$ATOMA_DECLARED_SECRETS" | jq -r ".[${slot}]")
            eval "secret_value=\${ATOMA_SECRET_${slot}:-}"
            if [ -n "$secret_value" ]; then
              export "${secret_name}=${secret_value}"
              echo "Secret ${secret_name} is available to this run."
            else
              echo "::warning::config.json declares secret ${secret_name}, but this repository has no secret by that name. Whatever needs it will fail."
            fi
            slot=$((slot + 1))
          done

          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/run_deploy.ts" --ref "${ATOMA_DEPLOY_REF}" --trigger "${ATOMA_DEPLOY_TRIGGER}" --target "${ATOMA_DEPLOY_TARGET_INPUT}"
