name: Atoma Dispatch

# Detects <!-- atoma:dispatch=AGENT --> comments on issues
# and dispatches the specified agent via atoma-runner.
# This replaces the old label-based and script-based dispatch.

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.comment.body, 'atoma:dispatch=')
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Parse dispatch comment and trigger agent
        shell: bash
        run: |
          AGENT=$(echo '${{ github.event.comment.body }}' | grep -oP '(?<=<!-- atoma:dispatch=)[a-z][a-z0-9-]*(?= -->)' || true)
          if [ -z "$AGENT" ]; then
            echo "No dispatch marker found; skipping"
            exit 0
          fi
          echo "Dispatching agent: ${AGENT} on issue #${ISSUE_NUMBER}"
          gh workflow run "atoma-runner.yml" \
            --field agent="${AGENT}" \
            --field number="${ISSUE_NUMBER}" \
            --field type="issue" \
            --field notify=""
