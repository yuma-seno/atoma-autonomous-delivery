        id: issue-branch
        if: inputs.type == 'issue'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run .github/scripts/resolve_issue_branch.ts --repo "${{ github.repository }}" --issue "${{ inputs.number }}"
