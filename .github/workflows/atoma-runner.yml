        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bun run .github/scripts/fetch_events.ts --type "${{ inputs.type }}" --number "${{ inputs.number }}" --out "events.json"
      - name: Restore agent session from atoma-data
        id: restore-session
        shell: bash
        run: |
          bun run .github/scripts/restore_agent_session.ts --type "${{ steps.fetch.outputs.resolved_type }}" --number "${{ steps.fetch.outputs.resolved_number }}" --agent "${{ inputs.agent }}" --out "session.json" --session-mode "${{ inputs.session_mode }}"
      - name: Merge GitHub context into session
        id: context
        shell: bash
        run: |
          bun run .github/scripts/reconcile_github_session.ts --events "events.json" --agent-name "${{ inputs.agent }}" --config ".github/atoma/config.json" --session "session.json" --out "session.json"
