name: Atoma Runner
'on':
  workflow_call:
    inputs:
      agent:
        description: Agent name to invoke
        required: true
        type: string
      number:
        description: Issue or PR number
        required: true
        type: string
      type:
        description: Context type
        required: true
        type: string
      notify:
        description: GitHub login to mention on completion
        required: false
        type: string
        default: ''
      session_mode:
        description: 'Session mode: continue restores history; recover archives history and rebuilds from GitHub context'
        required: false
        type: string
        default: continue
      atoma_version:
        description: Atoma CLI version tag to install, or `source` to build from a checkout of yuma-seno/atoma@main
        required: false
        type: string
        default: source
  workflow_dispatch:
    inputs:
      agent:
        description: Agent name to invoke
        required: true
        type: string
      number:
        description: Issue or PR number
        required: true
        type: string
      type:
        description: Context type
        required: true
        type: choice
        options:
          - issue
          - pr
      notify:
        description: GitHub login to mention on completion
        required: false
        type: string
        default: ''
      session_mode:
        description: 'Session mode: continue restores history; recover archives history and rebuilds from GitHub context'
        required: false
        type: choice
        options:
          - continue
          - recover
        default: continue
      atoma_version:
        description: Atoma CLI version tag to install, or `source` to build from a checkout of yuma-seno/atoma@main
        required: false
