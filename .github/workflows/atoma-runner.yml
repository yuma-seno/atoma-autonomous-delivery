        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          AGENT: ${{ inputs.agent }}
          NOTIFY: ${{ steps.notify.outputs.notify }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
