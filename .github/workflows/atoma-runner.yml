name: Atoma Runner
'on':
  workflow_call:
    inputs:
      agent:
        description: Agent name to invoke
        required: true
        type: string
      number:
        description: Issue or PR number
        required: true
        type: string
      type:
        description: Context type
        required: true
        type: string
      notify:
        description: GitHub login to mention on completion
        required: false
        type: string
        default: ''
      session_mode:
        description: 'Session mode: continue restores history; recover archives history and rebuilds from GitHub context'
        required: false
        type: string
        default: continue
      atoma_version:
        description: Atoma CLI version tag to install (e.g. v0.1.7). Use `source` to build from a checkout of yuma-seno/atoma@main.
        required: false
        type: string
        default: v0.1.17
  workflow_dispatch:
    inputs:
      agent:
        description: Agent name to invoke
        required: true
        type: string
      number:
        description: Issue or PR number
        required: true
        type: string
      type:
        description: Context type
        required: true
        type: choice
        options:
          - issue
          - pr
      notify:
        description: GitHub login to mention on completion
        required: false
        type: string
        default: ''
      session_mode:
        description: 'Session mode: continue restores history; recover archives history and rebuilds from GitHub context'
        required: false
        type: choice
        options:
          - continue
          - recover
        default: continue
      atoma_version:
        description: Atoma CLI version tag to install (e.g. v0.1.7). Use `source` to build from a checkout of yuma-seno/atoma@main.
        required: false
        type: string
        default: v0.1.17
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: atoma-${{ inputs.type }}-${{ inputs.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      issues: write
      pull-requests: write
      contents: write
    env:
      ATOMA_MACHINERY_ROOT: atoma-machinery
    steps:
      - name: Validate workflow inputs
        shell: bash
        env:
          AGENT: ${{ inputs.agent }}
          NUMBER: ${{ inputs.number }}
          TYPE: ${{ inputs.type }}
          SESSION_MODE: ${{ inputs.session_mode }}
          ATOMA_VERSION: ${{ inputs.atoma_version }}
          NOTIFY: ${{ inputs.notify }}
        run: |
          reject() {
            echo "::error::atoma-runner received an invalid \`$1\` input: '$2'. $3"
            exit 1
          }

          [[ "$AGENT" =~ ^[a-z][a-z0-9-]*$ ]] ||
            reject agent "$AGENT" "Expected a bare lowercase agent name, e.g. 'engineer'."
          [[ "$NUMBER" =~ ^[0-9]+$ ]] ||
            reject number "$NUMBER" "Expected an issue or pull request number."
          [[ "$TYPE" == "issue" || "$TYPE" == "pr" ]] ||
            reject type "$TYPE" "Expected 'issue' or 'pr'."
          [[ "$SESSION_MODE" == "continue" || "$SESSION_MODE" == "recover" ]] ||
            reject session_mode "$SESSION_MODE" "Expected 'continue' or 'recover'."
          # 'source' builds from a checkout; anything else is fetched as a release asset
          # and interpolated into a download URL, so keep it to a tag-shaped string.
          [[ "$ATOMA_VERSION" =~ ^(source|latest|v[0-9A-Za-z._-]+)$ ]] ||
            reject atoma_version "$ATOMA_VERSION" "Expected 'source', 'latest', or a release tag like 'v0.1.7'."
          # May be empty: a run with nobody to notify is normal.
          [[ "$NOTIFY" =~ ^[A-Za-z0-9-]*$ ]] ||
            reject notify "$NOTIFY" "Expected a GitHub login, or empty."

          echo "Inputs validated: ${TYPE} #${NUMBER}, agent=${AGENT}, session_mode=${SESSION_MODE}"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.type == 'pr' && format('refs/pull/{0}/head', inputs.number) || '' }}
      - name: Checkout the delivery machinery from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: atoma-machinery
      - name: Set branch env for PR type
        if: inputs.type != 'issue'
        shell: bash
        run: |
          echo "BRANCH=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_ENV
      - name: Setup Bun
        with:
          bun-version: latest
        uses: oven-sh/setup-bun@v2
      - name: Resolve the issue's branch
        id: issue-branch
        if: inputs.type == 'issue'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/resolve_issue_branch.ts" --repo "${{ github.repository }}" --issue "${{ inputs.number }}"
      - name: Check out the branch this run starts from
        if: inputs.type == 'issue'
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.issue-branch.outputs.branch }}
        run: |
          if [ -z "${BRANCH_NAME}" ]; then
            BRANCH_NAME=$(bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/get_config_value.ts" "base_branch" "")
            [ -n "${BRANCH_NAME}" ] || exit 0
          else
            echo "BRANCH=${BRANCH_NAME}" >> $GITHUB_ENV
          fi
          git fetch origin "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
          git checkout -B "${BRANCH_NAME}" "refs/remotes/origin/${BRANCH_NAME}"
      - name: Cache MCP server package downloads
        with:
          path: ~/.npm
          key: mcp-npm-${{ hashFiles('atoma-machinery/.github/atoma/mcp-packages.json') }}
          restore-keys: mcp-npm-
        uses: actions/cache@v4
      - name: Install MCP server packages
        shell: bash
        run: |
          MCP_PKGS_FILE="${ATOMA_MACHINERY_ROOT}/.github/atoma/mcp-packages.json"
          if [ ! -f "$MCP_PKGS_FILE" ]; then
            echo "No mcp-packages.json found; skipping MCP package installation."
            exit 0
          fi

          # Executables a tool server is started by name, installed globally.
          NPM_PKGS=$(jq -r '.npm[]? // empty' "$MCP_PKGS_FILE" 2>/dev/null || true)
          if [ -n "$NPM_PKGS" ]; then
            echo "Installing npm MCP packages: $NPM_PKGS"
            for pkg in $NPM_PKGS; do
              npm install -g "$pkg"
            done
            # Put the global bin directory on PATH so those names resolve.
            NPM_BIN=$(npm prefix -g)/bin
            echo "$NPM_BIN" >> "$GITHUB_PATH"
            echo "Added npm global bin to PATH: $NPM_BIN"
          fi

          # Packages a bundled script imports rather than spawns.
          #
          # The npm list above installs executables globally, which is right for a server
          # started by name. This list is for libraries a tool server imports, and those
          # have to be resolvable from the workspace — they are excluded from the bundle
          # because they reach native code a JavaScript bundler cannot carry.
          BUN_PKGS=$(jq -r '.bun[]? // empty' "$MCP_PKGS_FILE" 2>/dev/null || true)
          if [ -n "$BUN_PKGS" ]; then
            echo "Installing bun MCP libraries: $BUN_PKGS"
            bun add --no-save $BUN_PKGS
          fi

          # Python packages, for a tool server that ships as one.
          PIP_PKGS=$(jq -r '.pip[]? // empty' "$MCP_PKGS_FILE" 2>/dev/null || true)
          if [ -n "$PIP_PKGS" ]; then
            echo "Installing pip MCP packages: $PIP_PKGS"
            for pkg in $PIP_PKGS; do
              pip install "$pkg"
            done
          fi
      - name: Make tool hooks executable
        shell: bash
        run: |
          if [ -d "${ATOMA_MACHINERY_ROOT}/.github/atoma/tools/scripts/hooks" ]; then
            find "${ATOMA_MACHINERY_ROOT}/.github/atoma/tools/scripts/hooks" -name '*.ts' -exec chmod +x {} +
          fi
      - name: Run configured environment setup
        shell: bash
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/run_environment_setup.ts"
      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "atoma-${{ inputs.agent }}"
          git config user.email "atoma-${{ inputs.agent }}@users.noreply.github.com"
      - name: Resolve effective notify login
        id: notify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY: ${{ inputs.notify }}
          NUMBER: ${{ inputs.number }}
        run: |
          EFFECTIVE="$NOTIFY"
          if [ -z "$EFFECTIVE" ]; then
            EFFECTIVE=$(bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/resolve_notify.ts" --repo "${GITHUB_REPOSITORY}" --number "${NUMBER}")
            [ -n "$EFFECTIVE" ] && echo "Resolved notify fallback: ${EFFECTIVE}"
          fi
          echo "notify=${EFFECTIVE}" >> "$GITHUB_OUTPUT"
      - name: Fetch GitHub events
        id: fetch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/fetch_events.ts" --type "${{ inputs.type }}" --number "${{ inputs.number }}" --out "events.json"
      - name: Restore agent session from atoma-data
        id: restore-session
        shell: bash
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/restore_agent_session.ts" --type "${{ steps.fetch.outputs.resolved_type }}" --number "${{ steps.fetch.outputs.resolved_number }}" --agent "${{ inputs.agent }}" --out "session.json" --session-mode "${{ inputs.session_mode }}"
      - name: Merge GitHub context into session
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/reconcile_github_session.ts" --events "events.json" --agent-name "${{ inputs.agent }}" --agent-def "${ATOMA_MACHINERY_ROOT}/.github/atoma/agent-definitions/${{ inputs.agent }}.md" --config "${ATOMA_MACHINERY_ROOT}/.github/atoma/config.json" --session "session.json" --out "session.json"
      - name: Read max_iterations from config
        id: cfg
        shell: bash
        env:
          AGENT_NAME: ${{ inputs.agent }}
        run: |
          MAX=$(bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/get_config_value.ts" "agents.${AGENT_NAME}.max_iterations" "30")
          echo "max_iterations=${MAX}" >> "$GITHUB_OUTPUT"
          echo "Agent ${AGENT_NAME} max_iterations: ${MAX}"
      - name: Add atoma/in-progress label
        if: steps.context.outputs.new_event_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/manage_in_progress_label.ts" --action "add" --number "${NUMBER}"
      - name: Post reviewer-start comment
        if: steps.context.outputs.new_event_count != '0' && inputs.agent == 'reviewer' && inputs.type == 'pr'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
        run: |
          gh issue comment "$NUMBER" --body "<!-- atoma:llm-context=exclude -->
          Atoma: reviewer starting review."
      - name: 'Checkout Atoma source (for atoma_version: source)'
        uses: actions/checkout@v4
        with:
          repository: yuma-seno/atoma
          path: atoma-src
        if: inputs.atoma_version == 'source'
      - name: Install Atoma CLI
        shell: bash
        run: |
          VERSION="${{ inputs.atoma_version }}"
          if [ "$VERSION" = "source" ]; then
            echo "Building Atoma from source (atoma-src/) ..."
            cargo install --path atoma-src --force --locked
          elif [ "$VERSION" = "latest" ]; then
            URL="https://github.com/yuma-seno/atoma/releases/latest/download/atoma-linux-x86_64"
            echo "Downloading Atoma ${VERSION} ..."
            curl -fsSL "$URL" -o /usr/local/bin/atoma
            chmod +x /usr/local/bin/atoma
          else
            URL="https://github.com/yuma-seno/atoma/releases/download/${VERSION}/atoma-linux-x86_64"
            echo "Downloading Atoma ${VERSION} ..."
            curl -fsSL "$URL" -o /usr/local/bin/atoma
            chmod +x /usr/local/bin/atoma
          fi
          atoma --version
      - name: Put the tool servers on a user without sudo
        shell: bash
        run: |
          sudo useradd -M -U -s /usr/sbin/nologin "atoma-tools" 2>/dev/null || true
          id "atoma-tools"

          # Traverse-only down to the workspace, walked rather than hardcoded: the path
          # between HOME and the workspace is the runner's business, not ours.
          DIR="$GITHUB_WORKSPACE"
          while [ "$DIR" != "/" ]; do
            DIR=$(dirname "$DIR")
            # Stop before "/" itself, and before anything world-traversable already: a
            # self-hosted runner's workspace is often nowhere near $HOME, and walking to the
            # root would put an ACL on "/".
            [ "$DIR" = "/" ] && break
            sudo setfacl -m "u:atoma-tools:x" "$DIR"
            [ "$DIR" = "$HOME" ] && break
          done

          # Full access inside the tree, and as a default so later files inherit it. `X`
          # rather than `x`: execute on directories, not on every file.
          sudo setfacl -R -m "u:atoma-tools:rwX" "$GITHUB_WORKSPACE"
          sudo setfacl -R -d -m "u:atoma-tools:rwX" "$GITHUB_WORKSPACE"
          sudo setfacl -R -d -m "u:$(id -un):rwX" "$GITHUB_WORKSPACE"

          # Somewhere real for the caches, since $HOME is not writable by this user.
          sudo install -d -o "atoma-tools" -m 0700 "${RUNNER_TEMP}/atoma-tool-cache"

          # And a directory for the credentials file that the TOOL USER owns, so atoma can
          # unlink it. Owned by them, writable by us: the runner writes the file into it and
          # hands it over, and the delete that keeps the file and the servers from coexisting
          # then succeeds. Without this the delete fails and every credential stays readable.
          sudo install -d -o "atoma-tools" -m 0700 "$RUNNER_TEMP/atoma-credentials"
          sudo setfacl -m "u:$(id -un):rwx" "$RUNNER_TEMP/atoma-credentials"

          # Close the world-writable directories on PATH.
          #
          # The design rests on the tool user having no sudo. That is worth nothing while it
          # can write a directory the RUNNER's own later steps search: this job goes on to
          # run `git status`, `grep` and `gh issue comment` as the runner, which does have
          # passwordless sudo. Measured on ubuntu-latest: /opt/pipx_bin,
          # /usr/local/.ghcup/bin and /usr/local/bin are all drwxrwxrwx and all precede
          # /usr/bin.
          #
          # Computed from PATH rather than named, so an image that adds a fourth is covered.
          #
          # ORDER MATTERS, and this step is placed for it: every install this job performs
          # has to have happened already. The MCP packages, the environment setup -- and the
          # atoma CLI itself, which is written to /usr/local/bin. That last one is why this
          # step sits after "Install Atoma CLI" rather than after the environment setup: it
          # did not, and the first real run failed with
          #   curl: (23) Failure writing output to destination
          # because the directory curl was writing into had just been closed.
          for dir in ${PATH//:/ }; do
            [ -d "$dir" ] || continue
            case "$(stat -L -c '%A' "$dir" 2>/dev/null)" in
              *w?) sudo chmod go-w "$dir" && echo "closed world-writable PATH entry: $dir";;
            esac
          done

          # Git as the tool user, over a checkout the runner owns.
          #
          # `actions/checkout` writes this into the runner's own gitconfig, which the tool
          # user can read through the traversal granted above -- but that is a default of a
          # third-party action, and `github__commit_and_push` and every `git` the agent runs
          # depend on it. Said explicitly, at system level, so it does not.
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true

          echo "tool servers will run as atoma-tools (no sudo), caches in ${RUNNER_TEMP}/atoma-tool-cache"
      - name: Resolve which repository secrets may reach this run
        id: secret-names
        shell: bash
        env:
          ATOMA_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          DEFAULT_BRANCH="${ATOMA_DEFAULT_BRANCH:-main}"
          TRUSTED_CONFIG="$RUNNER_TEMP/atoma-declared-secrets.json"

          # Fetched into a ref this line owns, and read back from that same ref, so a
          # failed fetch has nothing to fall back to. Shallow: one commit of one branch is
          # all this needs. `+` so a re-run overwrites rather than refusing.
          if git fetch --quiet --depth=1 origin "+$DEFAULT_BRANCH:refs/atoma/trusted-config" 2>/dev/null \
            && git show "refs/atoma/trusted-config:.github/atoma/config.json" > "$TRUSTED_CONFIG" 2>/dev/null; then
            echo "Read the credential declaration from ${DEFAULT_BRANCH}."
          else
            # Either the branch has no config.json or the fetch failed, and this cannot
            # tell which. It does not need to: both answers are "declare nothing", which is
            # the safe one. Naming both is the honest message -- asserting the first would
            # be asserting something this could not determine.
            echo '{}' > "$TRUSTED_CONFIG"
            echo "::warning::Could not read .github/atoma/config.json from ${DEFAULT_BRANCH} (absent, or the fetch failed); this run reaches no declared credentials."
          fi

          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/read_secret_names.ts" --destination "tools" --config "$RUNNER_TEMP/atoma-declared-secrets.json"
      - name: Collect this run's credentials into a file
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATOMA_COPILOT_TOKEN: ${{ secrets.ATOMA_COPILOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ATOMA_SECRET_0: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[0]] }}
          ATOMA_SECRET_1: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[1]] }}
          ATOMA_SECRET_2: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[2]] }}
          ATOMA_SECRET_3: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[3]] }}
          ATOMA_SECRET_4: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[4]] }}
          ATOMA_SECRET_5: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[5]] }}
          ATOMA_SECRET_6: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[6]] }}
          ATOMA_SECRET_7: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[7]] }}
          ATOMA_SECRET_8: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[8]] }}
          ATOMA_SECRET_9: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[9]] }}
          ATOMA_SECRET_NAMES: ${{ steps.secret-names.outputs.names }}
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/write_credentials_file.ts" --out "$RUNNER_TEMP/atoma-credentials/credentials.json"
          # Handed to the user atoma runs as, which reads it and deletes it before starting
          # any server. Handed over rather than opened up: it holds every credential the run
          # supplies, and this step's own user keeps none of them afterwards.
          sudo chown atoma-tools "$RUNNER_TEMP/atoma-credentials/credentials.json"
      - name: Run agent
        id: atoma
        if: steps.context.outputs.new_event_count != '0'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_NUMBER: ${{ steps.fetch.outputs.resolved_number }}
          ATOMA_RUN_TYPE: ${{ inputs.type }}
          ISSUE_NOTIFY: ${{ steps.notify.outputs.notify }}
          ATOMA_OPS_LOG: atoma_ops.log
          OPENAI_BASE_URL_IN: ${{ vars.OPENAI_BASE_URL }}
          ATOMA_PROVIDER_IN: ${{ vars.ATOMA_PROVIDER }}
        shell: bash
        run: |
          AGENT="${{ inputs.agent }}"
          # Exported (not just a local shell var) so MCP tool-server subprocesses
          # spawned by `atoma run` below can read the current agent's name, e.g. to
          # tag artifacts they create (PRs, issues) with their origin agent.
          export AGENT

          # Exported because the invocation below passes each one explicitly to `env`, and a
          # step's `env:` block is present in the shell's environment already -- this makes
          # the dependency visible rather than implicit.
          export GITHUB_RUN_ID ISSUE_NUMBER ISSUE_NOTIFY ATOMA_RUN_TYPE ATOMA_OPS_LOG

          TOOLS_ARG=""
          if [ -f "${ATOMA_MACHINERY_ROOT}/.github/atoma/tools/tools.yaml" ]; then
            TOOLS_ARG="--tools-file ${ATOMA_MACHINERY_ROOT}/.github/atoma/tools/tools.yaml"
          fi

          # Settings, not credentials. These two are repository VARIABLES -- which provider
          # to use and which host to reach -- so they belong in the environment; the
          # credentials do not, and are not here any more.
          #
          # Each is re-exported only when non-empty: exporting an empty ATOMA_PROVIDER would
          # defeat Atoma's provider auto-detection.
          for name in OPENAI_BASE_URL ATOMA_PROVIDER; do
            eval "value=\${${name}_IN:-}"
            if [ -n "$value" ]; then
              export "${name}=${value}"
            fi
          done

          # No --prompt-file or stdin is needed: the cached session contains both stable
          # GitHub context and the agent's chronological working history.
          # Run as the user the tool servers will inherit. Every server atoma starts is a
          # child of this process, so one `sudo -u` here is what puts all of them on that
          # user -- there is nothing per-server to configure or to forget.
          #
          # `env` in front rather than `--preserve-env`: the latter needs a sudoers
          # permission that a self-hosted runner may not grant, and both were measured, so
          # the portable one is used. Only what a server actually reads is passed; the
          # credentials are not here at all, they are in the file atoma deletes.
          #
          # HOME stays the runner's so the toolchain resolves. It is not writable by this
          # user, uniformly for every tool, and the caches are redirected below.
          # Built as an array so a setting that is EMPTY is not passed at all. `env NAME=`
          # sets the empty string, and atoma reads an empty base URL as a base URL -- which
          # would defeat the guard above and point every request at "/chat/completions".
          AGENT_ENV=(
            HOME="$HOME"
            PATH="$PATH"
            AGENT="$AGENT"
            ATOMA_MACHINERY_ROOT="$ATOMA_MACHINERY_ROOT"
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY"
            BRANCH="${BRANCH:-}"
            ISSUE_NUMBER="$ISSUE_NUMBER"
            ISSUE_NOTIFY="$ISSUE_NOTIFY"
            ATOMA_RUN_TYPE="$ATOMA_RUN_TYPE"
            ATOMA_OPS_LOG="$ATOMA_OPS_LOG"
            # Caches, because $HOME is read-only to this user. CARGO_HOME is not a cache
            # directory -- redirecting it also hides ~/.cargo/config.toml -- but cargo has no
            # separate cache variable, and a project needing that config can commit
            # .cargo/config.toml, which cargo reads from the work tree.
            XDG_CACHE_HOME="${RUNNER_TEMP}/atoma-tool-cache"
            XDG_CONFIG_HOME="${RUNNER_TEMP}/atoma-tool-cache/config"
            XDG_DATA_HOME="${RUNNER_TEMP}/atoma-tool-cache/data"
            BUN_INSTALL_CACHE_DIR="${RUNNER_TEMP}/atoma-tool-cache/bun"
            npm_config_cache="${RUNNER_TEMP}/atoma-tool-cache/npm"
            PIP_CACHE_DIR="${RUNNER_TEMP}/atoma-tool-cache/pip"
            CARGO_HOME="${RUNNER_TEMP}/atoma-tool-cache/cargo"
          )
          for name in OPENAI_BASE_URL ATOMA_PROVIDER; do
            eval "value=\${${name}:-}"
            if [ -n "$value" ]; then AGENT_ENV+=("${name}=${value}"); fi
          done

          EXIT_CODE=0
          sudo -n -u "atoma-tools" env "${AGENT_ENV[@]}" \
            atoma run \
            --agent-def "${ATOMA_MACHINERY_ROOT}/.github/atoma/agent-definitions/${AGENT}.md" \
            --in-session session.json \
            --out-session session.json \
            --template "${ATOMA_MACHINERY_ROOT}/.github/atoma/prompt-template.md" \
            --skills-dir "${ATOMA_MACHINERY_ROOT}/.github/atoma/skills" \
            --max-iterations "${{ steps.cfg.outputs.max_iterations }}" \
            --credentials-file "$RUNNER_TEMP/atoma-credentials/credentials.json" \
            ${TOOLS_ARG} \
            > atoma_output.txt 2> atoma_logs.txt || EXIT_CODE=$?

          echo "=== Atoma Logs ===" >&2
          cat atoma_logs.txt >&2

          if [ "$EXIT_CODE" = "2" ]; then
            echo "::notice::Max iterations reached — session saved for next run"
            echo "max_iterations_reached=true" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" != "0" ]; then
            exit $EXIT_CODE
          fi

          # Store multiline result as a step output.
          # Use a random delimiter to prevent early termination if the agent
          # output happens to contain the delimiter string on its own line.
          RESULT_EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "result<<${RESULT_EOF}"
            cat atoma_output.txt
            echo "${RESULT_EOF}"
          } >> "$GITHUB_OUTPUT"

          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/extract_directive.ts" --output-file "atoma_output.txt" --def-dir "${ATOMA_MACHINERY_ROOT}/.github/atoma/agent-definitions"

          # Detect whether a tool call already triggered an automatic follow-up
          # dispatch during this run (atoma__launch_sub_agent, github__create_pr ->
          # reviewer, github__merge_pr -> orchestrator-or-re-invoked-agent), as
          # opposed to the agent genuinely finishing with nothing further happening.
          # Every dispatch site writes a structured `{"op":"dispatch",...}` entry to
          # the ops log (see lib/ops-log.ts's logDispatch()) -- checking for that one
          # stable, documented JSON field is far more robust than the previous
          # approach (grepping atoma_logs.txt's raw stderr TEXT for hand-written
          # strings like "dispatched: agent=..."), which silently broke once already
          # when a refactor changed a log message's wording without updating the grep
          # pattern to match.
          CHAIN_CONTINUES=false
          if [ -f atoma_ops.log ] && grep -q '"op":"dispatch"' atoma_ops.log; then
            CHAIN_CONTINUES=true
          fi
          echo "chain_continues=${CHAIN_CONTINUES}" >> "$GITHUB_OUTPUT"
      - name: Write token usage summary
        if: always() && hashFiles('atoma_logs.txt') != ''
        shell: bash
        run: |
          USAGE_LINE=$(grep -m1 "ATOMA_TOKEN_USAGE:" atoma_logs.txt 2>/dev/null || true)
          if [ -z "$USAGE_LINE" ]; then
            exit 0
          fi
          PROMPT=$(echo "$USAGE_LINE"     | grep -oP 'prompt=\K[0-9]+' || true)
          COMPLETION=$(echo "$USAGE_LINE" | grep -oP 'completion=\K[0-9]+' || true)
          TOTAL=$(echo "$USAGE_LINE"      | grep -oP 'total=\K[0-9]+' || true)
          {
            echo "## Atoma Token Usage"
            echo "| Agent | Prompt | Completion | Total |"
            echo "|------------|--------|------------|-------|"
            echo "| ${{ inputs.agent }} | ${PROMPT:-—} | ${COMPLETION:-—} | ${TOTAL:-—} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post result comment
        id: post-result
        if: steps.atoma.outcome == 'success' && steps.context.outputs.new_event_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/post_result_comment.ts" --number "${{ inputs.number }}" --agent "${{ inputs.agent }}" --type "${{ inputs.type }}" --notify "${{ steps.notify.outputs.notify }}" --directive "${{ steps.atoma.outputs.directive }}" --chain-continues "${{ steps.atoma.outputs.chain_continues }}" --max-iterations-reached "${{ steps.atoma.outputs.max_iterations_reached }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Record run metadata
        if: steps.atoma.outcome == 'success' && steps.post-result.outputs.comment_id != ''
        shell: bash
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/record_run_metadata.ts" --session "session.json" --comment-id "${{ steps.post-result.outputs.comment_id }}" --agent "${{ inputs.agent }}" --snapshot-hash "${{ steps.context.outputs.context_snapshot_hash }}" --event-count "${{ steps.context.outputs.context_event_count }}" --type "${{ steps.fetch.outputs.resolved_type }}" --resolved-number "${{ steps.fetch.outputs.resolved_number }}"
      - name: Save session to atoma-data branch
        if: steps.atoma.outcome == 'success'
        shell: bash
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/save_agent_session.ts" --session "session.json" --type "${{ steps.fetch.outputs.resolved_type }}" --number "${{ steps.fetch.outputs.resolved_number }}" --agent "${{ inputs.agent }}"
      - name: Report failure
        if: always() && job.status != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          AGENT: ${{ inputs.agent }}
          NOTIFY: ${{ steps.notify.outputs.notify }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NUMBER" ]; then
            echo "::error::Cannot post failure comment: issue/PR number unknown."
            exit 0
          fi
          AGENT_LABEL="${AGENT:+${AGENT} }Atoma"
          ERR_MSG=""
          if [ -f atoma_logs.txt ]; then
            # Redacted before it becomes a comment. `atoma_logs.txt` holds every MCP
            # server's stderr, and `unauthorized` -- one of the words grepped for here --
            # is exactly the line a provider or a `gh` call emits WITH the credential in
            # it. GitHub masks registered secrets in the workflow log and does nothing for
            # an issue comment, so this excerpt would arrive in the clear.
            #
            # Shape patterns only: this step holds no credential values, and handing it
            # some so it could match them literally would put them in one more process's
            # environment to protect one comment. A failure to redact yields no excerpt
            # rather than a raw one.
            ERR_MSG=$(grep -iP 'error|fail|panic|exception|unauthorized' atoma_logs.txt | head -n 5 | bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/redact_stream.ts" || true)
          fi
          MENTION=""
          if [ -n "$NOTIFY" ]; then
            MENTION="@${NOTIFY} - "
          fi
          BD=$(mktemp)
          echo "${MENTION}Warning: ${AGENT_LABEL} encountered an error." > "$BD"
          echo "Please check the reason and retry if necessary." >> "$BD"
          echo "Workflow logs: ${RUN_URL}" >> "$BD"
          if [ -n "$ERR_MSG" ]; then
            echo "" >> "$BD"
            echo "Error messages detected from logs (excerpt):" >> "$BD"
            printf '```\n' >> "$BD"
            echo "${ERR_MSG}" >> "$BD"
            printf '```\n' >> "$BD"
          fi
          gh issue comment "$NUMBER" --body-file "$BD"
          rm -f "$BD"
      - name: Check for uncommitted changes
        id: dirty
        if: steps.atoma.outcome == 'success'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Inject uncommitted changes into session
        if: steps.dirty.outputs.has_changes == 'true'
        shell: bash
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/inject_uncommitted_notice.ts"
      - name: Notify on max iterations
        if: steps.atoma.outputs.max_iterations_reached == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          NOTIFY: ${{ steps.notify.outputs.notify }}
          AGENT: ${{ inputs.agent }}
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/notify_max_iterations.ts" --number "${NUMBER}" --agent "${AGENT}" --notify "${NOTIFY}"
      - name: Manage auto-dispatch loop control
        id: loop-control
        if: steps.atoma.outcome == 'success'
        shell: bash
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/manage_dispatch_loop.ts" --session "session.json" --new-event-count "${{ steps.context.outputs.new_event_count }}" --directive "${{ steps.atoma.outputs.directive }}"
      - name: Decide whether to release the in-progress guard
        id: decide-guard-release
        if: always()
        shell: bash
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/decide_guard_release.ts" --outcome "${{ steps.atoma.outcome }}" --max-iterations-reached "${{ steps.atoma.outputs.max_iterations_reached }}" --loop-limit-reached "${{ steps.loop-control.outputs.loop_limit_reached }}" --chain-continues "${{ steps.atoma.outputs.chain_continues }}" --directive "${{ steps.atoma.outputs.directive }}"
      - name: Remove atoma/in-progress label on completion
        if: always() && steps.decide-guard-release.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
        run: |
          bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/manage_in_progress_label.ts" --action "remove" --number "${NUMBER}"
      - name: Dispatch next agent
        if: steps.atoma.outcome == 'success' && steps.atoma.outputs.directive != '' && steps.atoma.outputs.max_iterations_reached != 'true' && steps.loop-control.outputs.loop_limit_reached != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECTIVE: ${{ steps.atoma.outputs.directive }}
          NUMBER: ${{ inputs.number }}
          TYPE: ${{ inputs.type }}
          NOTIFY: ${{ steps.notify.outputs.notify }}
        run: |
          if ! [[ "$DIRECTIVE" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::Invalid directive value: ${DIRECTIVE}"
            exit 1
          fi

          echo "Dispatching '${DIRECTIVE}' on ${TYPE} #${NUMBER} via atoma-runner.yml ..."
          # Use gh workflow run with the current GH_TOKEN (caller's token, e.g. from issue_comment event).
          # This preserves the caller's token permissions (PR creation OK for issue_comment events).
          gh workflow run atoma-runner.yml \
            --field agent="$DIRECTIVE" \
            --field number="$NUMBER" \
            --field type="$TYPE" \
            --field notify="$NOTIFY"
      - name: Comment on loop limit reached
        if: steps.atoma.outcome == 'success' && steps.atoma.outputs.directive != '' && steps.atoma.outputs.max_iterations_reached != 'true' && steps.loop-control.outputs.loop_limit_reached == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          DIRECTIVE: ${{ steps.atoma.outputs.directive }}
          NOTIFY: ${{ steps.notify.outputs.notify }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$NUMBER" ]; then
            MENTION=""
            if [ -n "$NOTIFY" ]; then
              MENTION="@${NOTIFY} - "
            fi
            BD=$(mktemp)
            echo "${MENTION}Auto-dispatch loop limit (5 consecutive runs) reached." > "$BD"
            echo "To prevent unintended infinite agent loops and excessive API costs, further automatic handoff (next agent: ${DIRECTIVE}) has been safely suppressed." >> "$BD"
            echo "Please review the progress so far. To resume, post a manual comment on the Issue/PR (e.g. /${DIRECTIVE}) to trigger the next agent at any time." >> "$BD"
            echo "See the workflow run for details: ${RUN_URL}." >> "$BD"
            gh issue comment "$NUMBER" --body-file "$BD"
            rm -f "$BD"
          fi
