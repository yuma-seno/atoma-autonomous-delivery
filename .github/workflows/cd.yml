name: CD

# Publishes the deliverable as a release asset.
#
# This used to commit `dist/` to main on every merge, which is why it needed to
# be the one identity allowed to bypass the branch ruleset. That bypass was not
# achievable: GITHUB_TOKEN cannot push to a ruleset-protected branch, and the
# built-in GitHub Actions app is not a valid `Integration` bypass actor because
# it is not an app installed on the repository. Rather than introduce a dedicated
# GitHub App or a deploy key -- both of which leave the ruleset file depending on
# a value that only exists after some manual setup -- the deliverable stopped
# going to main at all. Nothing here needs a bypass now, and `dist/` is not
# tracked.
#
# The version is not passed in. `package.json`'s `version` is the single
# declaration, and the tag is derived from it, so the two cannot disagree and
# there is no separate tagging step to remember. Releasing is therefore an
# ordinary reviewed change: bump the version, and merging it publishes.
#
# Idempotent, and that is what makes the trigger safe to be "every merge". This
# runs on all of them, finds a release already exists for the declared version,
# and stops before installing anything. Only a merge that changes the version
# reaches the build.
#
# Two triggers, for the same reason ci.yml has three.
#
# A human merging fires the `push` below.
#
# An agent merge does not: GitHub starts no workflow run for events its own token
# triggers, so merging with GITHUB_TOKEN fires no `push` on main and nothing
# chains off it. The reviewer's `mergePr` dispatches this workflow instead, via
# `workflows.cd` in `.github/atoma/config.json`. Without that entry a version
# bump merged by an agent would never publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialised. Two merges landing together would otherwise both reach the release
# creation, and the loser fails on a tag that now exists.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creating the release, its tag, and the asset. No `git push` anywhere in
      # this job -- main is never written to.
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Deliberately before any setup: the common case is a merge that does not
      # change the version, and that case should cost a checkout and one API
      # call rather than a Bun install and a build.
      - name: Decide whether there is a version to release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version // empty' package.json)
          if [ -z "$VERSION" ]; then
            echo "::error::package.json declares no version; nothing can be released."
            exit 1
          fi
          # The version reaches a tag name and a filename, so keep it to a shape
          # that cannot mean anything else.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version '$VERSION' is not a plain semver string."
            exit 1
          fi

          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is already released; nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$TAG has no release yet; building it."
          fi
      - name: Setup Bun
        if: steps.decide.outputs.release == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        if: steps.decide.outputs.release == 'true'
        run: bun install --frozen-lockfile
      - name: Build the deliverable
        if: steps.decide.outputs.release == 'true'
        run: bun run synth
      # The archive root holds `.github/`, so an adopter extracts it at their
      # repository root and the files land where they belong.
      #
      # Deliberately a fixed asset name rather than one carrying the version: it
      # is what makes `releases/latest/download/atoma-delivery.zip` a stable URL,
      # and the version is already carried by the release itself.
      - name: Package dist/ as a release asset
        if: steps.decide.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d dist/.github ]; then
            echo "::error::synth produced no dist/.github; nothing to package."
            exit 1
          fi
          # `zip` from inside dist/ so the archive holds `.github/...` and not
          # `dist/.github/...`. Naming `.github` explicitly is what includes it;
          # a bare `zip -r .` would skip the dotfile entry.
          (cd dist && zip -qr ../atoma-delivery.zip .github)
          unzip -l atoma-delivery.zip | tail -1
      # `--target` is what creates the tag, so there is no separate tag push and
      # no window where a tag exists without a release behind it.
      - name: Create the release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.decide.outputs.tag }}" atoma-delivery.zip \
            --title "${{ steps.decide.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --generate-notes
