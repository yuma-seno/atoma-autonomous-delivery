name: CD

# Publishes the deliverable as a release asset.
#
# This used to commit `dist/` to main on every merge, which is why it needed to
# be the one identity allowed to bypass the branch ruleset. That bypass was not
# achievable: GITHUB_TOKEN cannot push to a ruleset-protected branch, and the
# built-in GitHub Actions app is not a valid `Integration` bypass actor because
# it is not an app installed on the repository. Rather than introduce a dedicated
# GitHub App or a deploy key -- both of which leave the ruleset file depending on
# a value that only exists after some manual setup -- the deliverable stopped
# going to main at all. Nothing here needs a bypass now, and `dist/` is not
# tracked.
#
# A release is cut from a version tag, not from every merge. That is the point:
# adopters could previously only copy "whatever main had when I cloned", with no
# version to name. `package.json`'s `version` is the source of truth and the tag
# must agree with it, so the version lives in reviewed code rather than in
# whoever typed the tag.
#
# Two triggers, for the same reason ci.yml has three.
#
# A human pushing `v0.1.0` fires the `push` event below.
#
# An agent cannot rely on that: GitHub starts no workflow run for events its own
# token triggers, so a tag pushed with GITHUB_TOKEN fires nothing. Dispatching
# against the tag ref is the documented way through:
#
#   gh workflow run cd.yml --ref v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Serialised per tag. Re-running a release while the first attempt is still
# uploading would have both racing to attach the same asset.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and attaching the asset. No `git push` anywhere in
      # this job -- main is never written to.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `workflow_dispatch` accepts any ref, including a branch, and a branch has
      # no version to publish. Fail before building rather than producing an
      # asset named after something that is not a release.
      - name: Refuse to release anything but a version tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::CD publishes a version tag; got $GITHUB_REF_TYPE '$GITHUB_REF_NAME'."
            echo "Dispatch against a tag instead: gh workflow run cd.yml --ref v0.1.0"
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(jq -r '.version' package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME disagrees with package.json version $PKG_VERSION."
            echo "The version is declared in package.json and reviewed there; the tag only names it."
            exit 1
          fi
          echo "Releasing $GITHUB_REF_NAME (package.json version $PKG_VERSION)."
      - name: Build the deliverable
        run: bun run synth
      # The archive root holds `.github/`, so an adopter extracts it at their
      # repository root and the files land where they belong.
      #
      # Deliberately a fixed asset name rather than one carrying the version: it
      # is what makes `releases/latest/download/atoma-delivery.zip` a stable URL,
      # and the version is already carried by the release itself.
      - name: Package dist/ as a release asset
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d dist/.github ]; then
            echo "::error::synth produced no dist/.github; nothing to package."
            exit 1
          fi
          # `zip` from inside dist/ so the archive holds `.github/...` and not
          # `dist/.github/...`. Naming `.github` explicitly is what includes it;
          # a bare `zip -r . ` would skip the dotfile entry.
          (cd dist && zip -qr ../atoma-delivery.zip .github)
          unzip -l atoma-delivery.zip | tail -1
      # Idempotent on purpose. A dispatch is the agent path and also the retry
      # path, so re-running a tag whose release already exists has to replace the
      # asset instead of failing.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing the asset."
            gh release upload "$TAG" atoma-delivery.zip --clobber
          else
            gh release create "$TAG" atoma-delivery.zip \
              --title "$TAG" \
              --generate-notes
          fi
