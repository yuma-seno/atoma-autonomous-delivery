name: CD

# Publishes the deliverable. Separate from CI on purpose:
#
# - Different job, different blast radius. CI is read-only; this job holds
#   `contents: write` and is the sole identity allowed to bypass the branch
#   ruleset. Keeping it in its own file makes that surface obvious to review
#   rather than buried under a job-level `if:`.
# - While it lived in ci.yml it was skipped on every pull request, and a skipped
#   job still records a check run. That is noise at best, and a live trap the
#   moment anyone adds `publish-dist` to the ruleset's required checks, because
#   GitHub does not count a skipped required check as satisfied.
#
# Two triggers, because the two merge paths reach main differently.
#
# `workflow_run` covers the human path: a person merging fires a real `push` on
# main, CI runs, and chaining off its success preserves the gate that
# `needs: [check]` gave before CI and CD were separated.
#
# `workflow_dispatch` covers the autonomous path, and is not optional. An agent
# merge is performed with GITHUB_TOKEN, and GitHub starts no workflow run for
# events its own token triggers -- so no `push` fires, no CI runs, and no
# `workflow_run` follows. Chained alone, this workflow never ran after an agent
# merge, and since CI also rejects any pull request that edits `dist/`, the
# deliverable had no route to be updated at all: it would have frozen silently the
# moment direct pushes to main were forbidden. `mergePr` now dispatches this
# workflow after a successful merge.
#
# Publishing on dispatch without CI having re-run on main is sound: the merge gate
# already required the `check` context to be green on the merged head, `dist/` is a
# pure function of `src/`, and a broken `synth` fails this job rather than
# publishing anything.
#
# No loop: the push below is made as github-actions[bot], whose events start no
# workflow run.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Serialised: two publishes racing would both `git push`, and the loser is
# rejected non-fast-forward with nothing retrying it.
concurrency:
  group: publish-dist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-dist:
    runs-on: ubuntu-latest
    # `workflow_run` fires for any conclusion, including failure and cancellation.
    # A dispatch has no `workflow_run` context, so allow it through explicitly.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    steps:
      # Deliberately the default GITHUB_TOKEN, not a PAT. GitHub refuses to let an
      # App create or update files under the real `.github/workflows/`, and that
      # refusal is load-bearing: it is what guarantees this job -- the one identity
      # allowed to bypass the branch ruleset -- cannot alter a workflow definition.
      # `dist/.github/workflows/` is unaffected, so publishing still works.
      #
      # Checks out the branch tip rather than the triggering commit: the point is
      # to leave main's dist/ current, and pushing a detached older SHA would
      # undo a newer publish.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate dist/
        run: bun run synth
      - name: Refuse to publish anything but dist/
        # This job holds the ruleset bypass, so bound what it can possibly commit.
        # A synth that reached outside dist/ must stop here rather than ride the
        # bypass onto main.
        shell: bash
        run: |
          # No `head` in the pipeline: `shell: bash` runs with `-o pipefail`, so a
          # closed pipe would kill the step at the assignment and the error below
          # would never print. Truncate when reporting instead.
          STRAY=$(git status --porcelain -- . ':(exclude)dist')
          if [ -n "$STRAY" ]; then
            echo "::error::synth modified paths outside dist/; refusing to publish:"
            printf '%s\n' "$STRAY" | head -20 | sed 's/^/  /'
            exit 1
          fi
      - name: Commit and push dist/ if it changed
        shell: bash
        run: |
          git add dist
          # `git diff` (unstaged) silently ignores untracked files, which every
          # newly generated file under dist/ is -- check the *staged* diff.
          if git diff --cached --quiet; then
            echo "Nothing to publish -- dist/ already matches src/**."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(auto): publish generated dist/ [skip ci]"
          git push origin HEAD:main
