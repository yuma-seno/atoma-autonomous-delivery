name: CI

# This workflow is hand-written YAML, intentionally NOT generated by
# github-actions-workflow-ts (unlike everything under dist/.github/workflows/).
# It manages this repository's own build, not the Atoma template deliverable,
# so it's kept decoupled from that generation pipeline.

# `workflow_dispatch` is what makes the merge gate work. Agent branches are
# pushed and their PRs opened with GITHUB_TOKEN, and GitHub does not start a
# workflow run for events it triggers -- so neither `push` nor `pull_request`
# ever fires for them. `workflow_dispatch` is the documented exception, and the
# reviewer's `check_merge_readiness` tool uses it to put a real `check` run on
# the head commit of the PR it is about to merge.
#
# `pull_request` still earns its place: it covers human-opened PRs, where the
# events do fire.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # `gh pr diff` in "Reject generated output"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      # Generated output belongs to the deploy job, never to a pull request.
      #
      # Two concrete reasons, both already observed here. This system dispatches
      # sub-issues in parallel, so two agent branches regenerating the same
      # bundles collide in files no human wrote. And a regenerated bundle runs to
      # hundreds of kilobytes -- PR #189 was +22900/-23 -- which buries the `src/`
      # change a reviewer actually has to read.
      #
      # Only `dist/` is checked. `.github/` is no longer generated on every
      # push -- it is this repository's deliberate adoption of the deliverable,
      # upgraded by `bun run adopt:self` and reviewed in a pull request like any
      # other change.
      - name: Reject generated output in the diff
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          GENERATED=$(gh pr diff "$PR" --name-only | grep -E '^dist/' || true)
          if [ -n "$GENERATED" ]; then
            echo "::error::This pull request edits generated output. Drop these files and let the deploy job produce them:"
            echo "$GENERATED" | sed 's/^/  /'
            exit 1
          fi
          echo "No generated output in the diff."
      # Verifies the deliverable still BUILDS, without requiring dist/ to be
      # committed -- the counterpart to the check above. A synth that only breaks
      # after merge would leave main unable to deploy.
      - name: Verify the deliverable still builds
        if: github.event_name == 'pull_request'
        run: bun run synth

  publish-dist:
    runs-on: ubuntu-latest
    needs: [check]
    # Pushes to main, so it must stay on the `push` trigger. On a
    # `pull_request` or `workflow_dispatch` run it would put a branch's
    # generated output onto main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      # Deliberately the default GITHUB_TOKEN, not a PAT. GitHub refuses to let
      # an App create or update files under the real `.github/workflows/`, and
      # that refusal is load-bearing here: it is what guarantees this job -- the
      # one identity allowed to bypass the branch ruleset -- cannot alter a
      # workflow definition. `dist/.github/workflows/` is unaffected by the
      # restriction, so publishing the deliverable still works.
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate dist/
        run: bun run synth
      - name: Refuse to publish anything but dist/
        # This job holds the ruleset bypass, so bound what it can possibly commit.
        # A synth that reached outside dist/ must stop here rather than ride the
        # bypass onto main.
        shell: bash
        run: |
          STRAY=$(git status --porcelain -- . ":(exclude)dist" | head -20)
          if [ -n "$STRAY" ]; then
            echo "::error::synth modified paths outside dist/; refusing to publish:"
            echo "$STRAY"
            exit 1
          fi
      - name: Commit and push dist/ if it changed
        shell: bash
        run: |
          git add dist
          # `git diff` (unstaged) silently ignores untracked files, which every
          # newly generated file under dist/ is -- check the *staged* diff.
          if git diff --cached --quiet; then
            echo "Nothing to publish -- dist/ already matches src/**."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(auto): publish generated dist/ [skip ci]"
          git push
