name: CI

# This workflow is hand-written YAML, intentionally NOT generated by
# github-actions-workflow-ts (unlike everything under dist/.github/workflows/).
# It manages this repository's own build, not the Atoma template deliverable,
# so it's kept decoupled from that generation pipeline.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test

  sync-dist:
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate dist/
        run: bun run synth
      - name: Deploy dist/.github into .github (dogfooding)
        # This repo develops itself using the very Atoma workflows it
        # generates: everything under .github/ is disposable/regenerated
        # from dist/.github/ except this file (ci.yml) itself, which is
        # preserved across the wipe-and-repopulate.
        shell: bash
        run: |
          mkdir -p /tmp/keep-ci
          cp .github/workflows/ci.yml /tmp/keep-ci/ci.yml
          rm -rf .github
          mkdir -p .github/workflows
          cp -r dist/.github/. .github/
          cp /tmp/keep-ci/ci.yml .github/workflows/ci.yml
      - name: Commit and push if the generated output changed
        shell: bash
        run: |
          if git diff --quiet -- dist .github; then
            echo "Nothing to sync -- dist/ and .github/ already match src/**."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist .github
          git commit -m "chore: sync generated dist/ and .github/ [skip ci]"
          git push
