name: CI

# This workflow is hand-written YAML, intentionally NOT generated by
# github-actions-workflow-ts (unlike everything under dist/.github/workflows/).
# It manages this repository's own build, not the Atoma template deliverable,
# so it's kept decoupled from that generation pipeline.

# `workflow_dispatch` is what makes the merge gate work. Agent branches are
# pushed and their PRs opened with GITHUB_TOKEN, and GitHub does not start a
# workflow run for events it triggers -- so neither `push` nor `pull_request`
# ever fires for them. `workflow_dispatch` is the documented exception, and the
# reviewer's `check_merge_readiness` tool uses it to put a real `check` run on
# the head commit of the PR it is about to merge.
#
# `pull_request` still earns its place: it covers human-opened PRs, where the
# events do fire.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      # Pull requests must arrive with dist/ already regenerated, so a change to
      # src/ cannot merge while the deliverable adopters copy still shows the old
      # behaviour.
      #
      # Deliberately NOT run on `push`: on main, sync-dist is what regenerates
      # dist/, and it declares `needs: [check]`. Failing this step there would
      # block the only job able to fix the thing it is complaining about.
      - name: Verify dist/ matches src/
        if: github.event_name == 'pull_request'
        run: bun run synth:check

  sync-dist:
    runs-on: ubuntu-latest
    needs: [check]
    # Deploys by committing and pushing to main, so it must stay on the `push`
    # trigger only. On a `pull_request` run it would push a PR branch's generated
    # output onto main; on a `workflow_dispatch` run (which the merge gate fires
    # against an unmerged agent branch) it would do the same.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Empirically confirmed (2026-07-22): the default GITHUB_TOKEN's
          # push is rejected once it touches .github/workflows/**, with
          # "refusing to allow a GitHub App to create or update workflow
          # ... without `workflows` permission" -- a hard GitHub restriction
          # with no `permissions:` YAML equivalent to grant it. This job
          # needs to push there (see "Deploy dist/.github into .github"
          # below), so it checks out with a PAT that has the `repo` +
          # `workflow` scopes, stored as the WORKFLOW_PAT secret.
          token: ${{ secrets.WORKFLOW_PAT }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate dist/
        run: bun run synth
      - name: Deploy dist/.github into .github (dogfooding)
        # This repo develops itself using the very Atoma workflows it
        # generates: everything under .github/ is disposable/regenerated
        # from dist/.github/ except this file (ci.yml) itself, which is
        # preserved across the wipe-and-repopulate.
        shell: bash
        run: |
          mkdir -p /tmp/keep-ci
          cp .github/workflows/ci.yml /tmp/keep-ci/ci.yml
          rm -rf .github
          mkdir -p .github/workflows
          cp -r dist/.github/. .github/
          cp /tmp/keep-ci/ci.yml .github/workflows/ci.yml
      - name: Commit and push if the generated output changed
        shell: bash
        run: |
          git add dist .github
          # `git diff` (unstaged) silently ignores untracked files, which is
          # exactly what every file under dist/.github/atoma/** and the
          # deployed .github/workflows/*.yml was on the very first sync --
          # check the *staged* diff instead, which correctly includes them.
          if git diff --cached --quiet; then
            echo "Nothing to sync -- dist/ and .github/ already match src/**."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(auto): sync generated dist/ and .github/ [skip ci]"
          git push
