name: CI

# This workflow is hand-written YAML, intentionally NOT generated by
# github-actions-workflow-ts (unlike everything under dist/.github/workflows/).
# It verifies this repository's own build, not the Atoma template deliverable,
# so it's kept decoupled from that generation pipeline.
#
# Verification only. Publishing the deliverable is cd.yml, which is no longer
# chained off this workflow: a release is cut from a version tag, not from every
# merge — see the reasoning in that file.

# `workflow_dispatch` is what makes the merge gate work. Agent branches are
# pushed and their PRs opened with GITHUB_TOKEN, and GitHub does not start a
# workflow run for events it triggers -- so neither `push` nor `pull_request`
# ever fires for them. `workflow_dispatch` is the documented exception, and the
# reviewer's `check_merge_readiness` tool uses it to put a real `check` run on
# the head commit of the PR it is about to merge.
#
# `pull_request` still earns its place: it covers human-opened PRs, where the
# events do fire.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks below scans this branch's own commits, which needs the base
          # branch present to know where they start.
          fetch-depth: 0
      # First, before anything builds: a leaked credential is worth knowing about
      # whether or not the code compiles.
      #
      # Scans this branch's commits, not the whole history. History is scanned by
      # nobody here on purpose — an old finding is not something this pull request
      # can fix, and failing every pull request over one teaches people to ignore
      # the check. Scan history deliberately, by hand, when you want to know.
      #
      # Agents commit through this same gate: their pull request runs `check` like
      # any other, and a merge waits on it.
      - name: Scan this branch's commits for secrets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Latest rather than a pinned version: the value of a secret scanner is
          # its rule set, and pinning freezes it at whatever was current the day
          # someone wrote the number down. Pin it here if you would rather review
          # each update.
          TAG=$(gh api repos/gitleaks/gitleaks/releases/latest --jq .tag_name)
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${TAG}/gitleaks_${TAG#v}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          # Works the same on all three triggers. `pull_request` sets
          # GITHUB_BASE_REF; `workflow_dispatch` -- the agent path -- does not, and
          # falls back to main, which is where their branches start. A push to main
          # merge-bases with itself and scans an empty range, having already been
          # scanned as a pull request.
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch --quiet origin "$BASE_REF"
          RANGE="$(git merge-base FETCH_HEAD HEAD)..HEAD"
          echo "Scanning $RANGE"
          /tmp/gitleaks git --log-opts="$RANGE" --redact --verbose --no-banner .
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # Before `test`, and unconditional, for two separate reasons.
      #
      # It proves the deliverable still builds. A synth that only breaks after
      # merge would leave the repository unable to cut a release.
      #
      # And `dist/` is no longer committed, so a fresh checkout has none. The
      # deployment contract test compares `src/atoma/` against the built tree and
      # silently passes when that tree is absent, so running synth afterwards
      # would have quietly retired the check instead of running it.
      - name: Build the deliverable
        run: bun run synth
      - name: Test
        run: bun run test
      # There used to be a "Reject generated output in the diff" step here, which
      # failed any pull request whose diff touched `dist/`. It existed because
      # `dist/` was tracked: parallel agent branches collided in regenerated
      # bundles, and a regenerated bundle buried the `src/` change under hundreds
      # of kilobytes (PR #189 was +22900/-23). Untracking `dist/` removes the
      # cause, so the guard went with it.
