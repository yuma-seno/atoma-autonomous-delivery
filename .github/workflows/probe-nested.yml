# Does the confined shell still start a container of its own?
#
# The confinement in #374 is expressed in three files, and whether it WORKS cannot
# be read off them: the failures were a uid the runner image already used, a
# subordinate range naming ids that did not exist, a setuid bit throwing away the
# capabilities it needed, and a masked /proc the kernel refuses to mount past. Each
# one produced a single line inside a single tool call, in a run nobody was watching.
#
# So it is measured instead. This runs the real confinement step and the real
# container argv, with a script in place of the tool server, and tries to start a
# nested container. It exists because three agent runs were asked this mechanical
# question and the third answered with 822k tokens about repositories that do not
# exist.
#
# Not part of the deliverable -- this repository's own CI, like ci.yml.
name: Nested containers

'on':
  pull_request:
    paths:
      - 'src/atoma/tools/tools.yaml'
      - 'src/scripts/prepare_shell_confinement.ts'
      - 'src/workflows/atoma-runner.wac.ts'
      - 'scripts/probe-nested-containers.ts'
      - '.github/workflows/probe-nested.yml'
  push:
    branches:
      - 'probe/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build the deliverable from src
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run synth
      - name: What the runner brings
        shell: bash
        run: |
          podman --version
          id
          getent passwd | cut -d: -f1,3 | tr '\n' ' '
          echo
          cat /proc/self/uid_map
      - name: Probe
        shell: bash
        run: bun run scripts/probe-nested-containers.ts
