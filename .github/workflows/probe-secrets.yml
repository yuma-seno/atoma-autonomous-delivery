name: Probe secrets on main
# Temporary. Measures, from the default branch and the trigger the shipped
# workflows will actually use, whether a run can hand its own secrets to a
# step -- one by name, and all of them as JSON. Removed once answered.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  named:
    runs-on: ubuntu-latest
    steps:
      - name: One named secret
        env:
          ONE: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${ONE:-}" ]; then echo "RESULT-NAMED reached the step"; else echo "RESULT-NAMED empty"; fi

  all_as_json:
    runs-on: ubuntu-latest
    steps:
      - name: Every secret as JSON
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          if [ -z "${ALL:-}" ]; then echo "RESULT-JSON empty"; exit 0; fi
          echo "RESULT-JSON populated"
          echo "keys $(echo "$ALL" | jq -r 'keys | join(" ")')"

  environment_expression:
    runs-on: ubuntu-latest
    environment:
      name: ${{ vars.PROBE_ENV || 'atoma-ungated' }}
    steps:
      - run: |
          echo "RESULT-ENV the mapping form accepted an expression"
