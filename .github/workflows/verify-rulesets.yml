name: Verify rulesets

# Branch protection is declared in `.github/rulesets/*.json` and this workflow
# holds the repository to it.
#
# It verifies rather than applies, because it cannot apply: creating or updating a
# ruleset goes through the repository administration API, and `administration` is
# not one of the permissions a workflow can grant GITHUB_TOKEN -- it is an App
# permission, not a workflow one. Writing it here produced an invalid workflow that
# never started a job. The alternative would be storing an admin PAT, which is
# precisely the kind of credential this repository just finished removing.
#
# So a human applies the file once with their own credentials (see
# CONTRIBUTING.md), and this fails from then on if the live configuration drifts.
#
# It reads `rules/branches/{branch}` -- the rules in EFFECT for the branch --
# rather than the ruleset document. Two reasons. GitHub returns `bypass_actors`
# only to a caller with write access to the ruleset, which is the administration
# permission GITHUB_TOKEN cannot hold, so comparing it would report drift that does
# not exist on every single run. And the effective rules are the thing worth
# asserting: they are what actually governs a merge, whichever ruleset supplies
# them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Declared protection is in effect on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          # No `|| true` here on purpose: swallowing a 403 or a rate limit would
          # print "not applied" and send the reader off to create a duplicate.
          live=$(gh api "repos/$REPO/rules/branches/$BRANCH")
          live_types=$(jq -rc '[.[].type] | sort | unique' <<<"$live")
          echo "Rules in effect on $BRANCH: $live_types"

          for file in .github/rulesets/*.json; do
            echo "Checking $file"

            want_types=$(jq -rc '[.rules[].type] | sort | unique' "$file")
            for type in $(jq -r '.rules[].type' "$file" | sort -u); do
              if jq -e --arg t "$type" 'any(.[]; .type == $t)' <<<"$live" >/dev/null; then
                echo "  ok      rule '$type' is in effect"
              else
                echo "::error file=$file::rule '$type' is declared but not in effect on $BRANCH"
                failed=1
              fi
            done

            for context in $(jq -r '[.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context] | .[]' "$file"); do
              if jq -e --arg c "$context" \
                'any(.[]; .type == "required_status_checks" and (.parameters.required_status_checks // [] | any(.context == $c)))' \
                <<<"$live" >/dev/null; then
                echo "  ok      required check '$context' is in effect"
              else
                echo "::error file=$file::required status check '$context' is declared but not required on $BRANCH"
                failed=1
              fi
            done
          done

          if [ "$failed" -ne 0 ]; then
            cat <<EOF

          The declared protection is not in effect. If no ruleset has been applied
          yet, apply it once from an account with admin on the repository:

            Settings -> Rules -> Rulesets -> New ruleset -> Import a ruleset

          or:

            gh api --method POST repos/$REPO/rulesets --input .github/rulesets/main.json
          EOF
            exit 1
          fi
          echo
          echo "Declared protection is in effect."
