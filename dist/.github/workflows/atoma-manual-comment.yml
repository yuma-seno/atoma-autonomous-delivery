# AUTO-GENERATED FILE -- DO NOT EDIT DIRECTLY.
# Source of truth: src/workflows/atoma-manual-comment.wac.ts
# Regenerate with: bun run synth

name: Atoma Manual Comment
'on':
  issue_comment:
    types:
      - created
permissions:
  actions: write
  issues: write
  pull-requests: write
  contents: write
jobs:
  parse:
    runs-on: ubuntu-latest
    if: (github.event.comment.user.type != 'Bot') || (github.event.comment.user.type == 'Bot' && contains(github.event.comment.body, 'atoma:dispatch'))
    outputs:
      agent: ${{ steps.command.outputs.agent }}
      number: ${{ steps.target.outputs.number }}
      type: ${{ steps.target.outputs.type }}
      notify: ${{ steps.target.outputs.notify }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        with:
          bun-version: latest
        uses: oven-sh/setup-bun@v2
      - name: 'Guard: reject comment while atoma/in-progress'
        id: guard
        if: github.event.comment.user.type != 'Bot'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          bun run .github/scripts/guard_comment_during_run.ts --number "${NUMBER}" --comment-id "${COMMENT_ID}" --commenter "${COMMENTER}"
      - name: Parse slash command
        id: command
        if: |-
          ((github.event.comment.user.type == 'Bot' &&
           contains(github.event.comment.body, 'atoma:dispatch')) ||
          (github.event.comment.user.type != 'Bot' &&
           (github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'))) && steps.guard.outputs.blocked != 'true'
        shell: bash
        env:
          ATOMA_COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          bun run .github/scripts/parse_comment_command.ts
      - name: Resolve target context
        id: target
        shell: bash
        env:
          NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ toJSON(github.event.issue.pull_request != null) }}
          NOTIFY: ${{ github.event.comment.user.login }}
        run: |
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          if [ "$IS_PR" = "true" ]; then
            echo "type=pr" >> "$GITHUB_OUTPUT"
          else
            echo "type=issue" >> "$GITHUB_OUTPUT"
          fi
          echo "notify=${NOTIFY}" >> "$GITHUB_OUTPUT"
  run:
    if: needs.parse.outputs.agent != ''
    uses: ./.github/workflows/atoma-runner.yml
    with:
      agent: ${{ needs.parse.outputs.agent }}
      number: ${{ needs.parse.outputs.number }}
      type: ${{ needs.parse.outputs.type }}
      notify: ${{ needs.parse.outputs.notify }}
    secrets: inherit
    needs:
      - parse
