          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          NOTIFY: ${{ steps.notify.outputs.notify }}
          AGENT: ${{ inputs.agent }}
        run: |
          bun run .github/atoma/tools/scripts/notify_max_iterations.ts --number "${NUMBER}" --agent "${AGENT}" --notify "${NOTIFY}"
      - name: Dispatch next agent
        if: steps.atoma.outcome == 'success'
        with:
